{% extends "base.html" %}

{% block content %}
<h2>Mega Admin Dashboard</h2>

<div class="row">
    <div class="col-md-3">
        <div class="card text-white bg-primary">
            <div class="card-body">
                <h5>Total Users</h5>
                <h2>{{ stats.total_users }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success">
            <div class="card-body">
                <h5>Total Appointments</h5>
                <h2>{{ stats.total_appts }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-info">
            <div class="card-body">
                <h5>Total Doctors</h5>
                <h2>{{ stats.doctors|length }}</h2>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning">
            <div class="card-body">
                <h5>Revenue</h5>
                <h2>${{ "%.2f"|format(stats.total_revenue) }}</h2>
            </div>
        </div>
    </div>
</div>

<a href="{{ url_for('admin.analytics') }}" class="btn btn-secondary mt-3">View Analytics</a>
<a href="/admin/users" class="btn btn-secondary mt-3">Manage Users</a> <!-- Stub -->
{% endblock %}
